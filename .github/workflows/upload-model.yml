name: Upload Model to Releases

# Run this ONCE manually to download the model from HuggingFace
# and store it permanently in GitHub Releases.
# After this succeeds, build.yml downloads from GitHub instead.

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'HuggingFace token (hf_...)'
        required: true
        type: string

jobs:
  upload:
    name: Download & Upload Model
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Gemma 3 1B from HuggingFace
        run: |
          MODEL="gemma3-1b-q8.task"
          TOKEN="${{ github.event.inputs.hf_token }}"

          echo "Token prefix: ${TOKEN:0:8}..."
          echo "⬇ Downloading from HuggingFace..."

          HTTP_CODE=$(curl -L \
            -H "Authorization: Bearer $TOKEN" \
            -H "User-Agent: LocalLLM-CI/1.0" \
            --output "$MODEL" \
            --write-out "%{http_code}" \
            --retry 3 --retry-delay 10 \
            --max-time 3600 \
            --progress-bar \
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q8_ekv1280.task")

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ litert-community failed ($HTTP_CODE), trying google/gemma-3-1b-it..."
            HTTP_CODE=$(curl -L \
              -H "Authorization: Bearer $TOKEN" \
              -H "User-Agent: LocalLLM-CI/1.0" \
              --output "$MODEL" \
              --write-out "%{http_code}" \
              --retry 3 --retry-delay 10 \
              --max-time 3600 \
              --progress-bar \
              "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q8_ekv1280.task")
            echo "HTTP: $HTTP_CODE"
          fi

          FILE_SIZE=$(stat -c%s "$MODEL" 2>/dev/null || echo "0")
          echo "File size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 104857600 ]; then
            echo "❌ File too small — likely an error page not the model"
            cat "$MODEL" | head -c 500
            exit 1
          fi

          echo "✅ Downloaded: $(du -sh $MODEL | cut -f1)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-v1
          name: "Gemma 3 1B Model (Built-in)"
          body: |
            ## Gemma 3 1B LiteRT Model

            This release stores the bundled AI model used by LocalLLM.
            **Do not delete** — the build workflow downloads from here.

            - Model: Gemma 3 1B IT INT4
            - Format: MediaPipe LiteRT .task
            - Size: ~529MB
          files: gemma3-1b-q8.task
          make_latest: false

      - name: Verify upload succeeded
        run: |
          echo "Verifying model-v1 release asset..."
          sleep 5
          ASSET_SIZE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/model-v1" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
assets = data.get('assets', [])
for a in assets:
    print(f\"{a['name']}: {a['size']} bytes ({a['size']//1024//1024}MB) - state: {a['state']}\")
if not assets:
    print('❌ No assets found in release!')
    sys.exit(1)
")
          echo "$ASSET_SIZE"
