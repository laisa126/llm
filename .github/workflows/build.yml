name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"; IS_RELEASE=true
          else
            VER="$(date +'%Y.%m.%d')-dev"; IS_RELEASE=false
          fi
          CODE=$(git rev-list --count HEAD)
          echo "version_name=$VER"   >> $GITHUB_OUTPUT
          echo "version_code=$CODE"  >> $GITHUB_OUTPUT
          echo "apk_name=LocalLLM-v$VER" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE"  >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR: $(du -sh gradle/wrapper/gradle-wrapper.jar | cut -f1)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
            echo "KEYSTORE_PATH=release.jks"                           >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"  >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore app/debug.jks -alias localllm \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=LocalLLM,O=LaiserDev,C=KE" \
              -storepass debugpass -keypass debugpass -noprompt
            echo "KEYSTORE_PATH=debug.jks"   >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=debugpass" >> $GITHUB_ENV
            echo "KEY_ALIAS=localllm"          >> $GITHUB_ENV
            echo "KEY_PASSWORD=debugpass"      >> $GITHUB_ENV
          fi

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.version_code }}

      - name: Locate & rename APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "app/build/outputs/apk/${{ steps.version.outputs.apk_name }}.apk"
          echo "APK=$(find app/build/outputs/apk -name "LocalLLM*.apk")" >> $GITHUB_ENV
          echo "Size: $(du -sh $APK | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ env.APK }}
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: ./artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalLLM v${{ needs.build.outputs.version_name }}
          files: ./artifacts/*.apk
          generate_release_notes: true
          body: |
            ## 🤖 LocalLLM v${{ needs.build.outputs.version_name }}
            Local AI coding assistant — Gemma 4 on-device, fully offline.
            **Install:** Download APK → Settings → Unknown Sources → Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
