name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"; IS_RELEASE=true
          else
            VER="$(date +'%Y.%m.%d')-dev"; IS_RELEASE=false
          fi
          CODE=$(git rev-list --count HEAD)
          echo "version_name=$VER"   >> $GITHUB_OUTPUT
          echo "version_code=$CODE"  >> $GITHUB_OUTPUT
          echo "apk_name=LocalLLM-v$VER" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE"  >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR: $(du -sh gradle/wrapper/gradle-wrapper.jar | cut -f1)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
            echo "KEYSTORE_PATH=release.jks"                           >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"  >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore app/debug.jks -alias localllm \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=LocalLLM,O=LaiserDev,C=KE" \
              -storepass debugpass -keypass debugpass -noprompt
            echo "KEYSTORE_PATH=debug.jks"   >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=debugpass" >> $GITHUB_ENV
            echo "KEY_ALIAS=localllm"          >> $GITHUB_ENV
            echo "KEY_PASSWORD=debugpass"      >> $GITHUB_ENV
          fi

      - name: Download bundled model (Gemma 3 1B)
        run: |
          DEST="app/src/main/assets/models"
          MODEL="gemma3-1b-int4.task"
          mkdir -p "$DEST"

          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "⚠ HF_TOKEN secret not set — skipping bundled model"
            exit 0
          fi

          echo "⬇ Downloading Gemma 3 1B from HuggingFace…"
          HTTP_CODE=$(curl -L \
            --header "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            --header "User-Agent: LocalLLM-CI/1.0" \
            --output "$DEST/$MODEL" \
            --write-out "%{http_code}" \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --progress-bar \
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.task")

          if [ "$HTTP_CODE" = "403" ]; then
            echo "⚠ HTTP 403 — Gemma license not yet accepted."
            echo "  1. Log in at huggingface.co"
            echo "  2. Go to: huggingface.co/google/gemma-3-1b-it"
            echo "  3. Click 'Acknowledge license' then re-run this workflow."
            echo "  Building APK without bundled model for now."
            rm -f "$DEST/$MODEL"
            exit 0
          fi

          if [ "$HTTP_CODE" = "401" ]; then
            echo "⚠ HTTP 401 — HF_TOKEN is invalid or expired."
            echo "  Generate a new token at huggingface.co/settings/tokens"
            echo "  Building APK without bundled model for now."
            rm -f "$DEST/$MODEL"
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠ Download failed with HTTP $HTTP_CODE — building without bundled model."
            rm -f "$DEST/$MODEL"
            exit 0
          fi

          SIZE=$(du -sh "$DEST/$MODEL" | cut -f1)
          echo "✅ Model bundled: $SIZE at $DEST/$MODEL"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.version_code }}

      - name: Locate & rename APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "app/build/outputs/apk/${{ steps.version.outputs.apk_name }}.apk"
          echo "APK=$(find app/build/outputs/apk -name "LocalLLM*.apk")" >> $GITHUB_ENV
          echo "Size: $(du -sh $APK | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ env.APK }}
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: ./artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalLLM v${{ needs.build.outputs.version_name }}
          files: ./artifacts/*.apk
          generate_release_notes: true
          body: |
            ## 🤖 LocalLLM v${{ needs.build.outputs.version_name }}
            Local AI coding assistant — Gemma 3 1B built-in, fully offline.

            **This APK includes Gemma 3 1B (~700MB) — no downloads needed after install.**

            **Install:** Download APK → Settings → Unknown Sources → Install
            **First launch:** Shows a one-time setup screen (~30s) then ready to use.

            Features: Agent mode · Code editor · Terminal · HTML Preview · Local API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
