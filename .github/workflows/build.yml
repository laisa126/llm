name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"; IS_RELEASE=true
          else
            VER="$(date +'%Y.%m.%d')-dev"; IS_RELEASE=false
          fi
          CODE=$(git rev-list --count HEAD)
          echo "version_name=$VER"   >> $GITHUB_OUTPUT
          echo "version_code=$CODE"  >> $GITHUB_OUTPUT
          echo "apk_name=LocalLLM-v$VER" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE"  >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR: $(du -sh gradle/wrapper/gradle-wrapper.jar | cut -f1)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
            echo "KEYSTORE_PATH=release.jks"                           >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"  >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                  >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"            >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore app/debug.jks -alias localllm \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=LocalLLM,O=LaiserDev,C=KE" \
              -storepass debugpass -keypass debugpass -noprompt
            echo "KEYSTORE_PATH=debug.jks"   >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=debugpass" >> $GITHUB_ENV
            echo "KEY_ALIAS=localllm"          >> $GITHUB_ENV
            echo "KEY_PASSWORD=debugpass"      >> $GITHUB_ENV
          fi

      - name: Download bundled model (Gemma 3 1B)
        run: |
          DEST="app/src/main/assets/models"
          MODEL="gemma3-1b-int4.task"
          mkdir -p "$DEST"

          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "⚠ HF_TOKEN not set — building without bundled model"
            exit 0
          fi

          TOKEN="${{ secrets.HF_TOKEN }}"
          echo "Token length: ${#TOKEN}"
          echo "Token prefix: ${TOKEN:0:5}..."

          # Verify token works
          WHOAMI=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://huggingface.co/api/whoami")
          echo "Token check: HTTP $WHOAMI"

          if [ "$WHOAMI" != "200" ]; then
            echo "⚠ Token invalid (HTTP $WHOAMI) — building without bundled model"
            exit 0
          fi

          echo "⬇ Downloading Gemma 3 1B…"

          # Try litert-community first
          HTTP_CODE=$(curl -L \
            -H "Authorization: Bearer $TOKEN" \
            -H "User-Agent: LocalLLM-CI/1.0" \
            --output "$DEST/$MODEL.tmp" \
            --write-out "%{http_code}" \
            --retry 3 --retry-delay 10 \
            --max-time 1800 \
            --progress-bar \
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.task")

          echo "litert-community: HTTP $HTTP_CODE"

          # If 403, try google/gemma-3-1b-it directly
          if [ "$HTTP_CODE" = "403" ]; then
            echo "litert-community gated — trying google/gemma-3-1b-it…"
            HTTP_CODE=$(curl -L \
              -H "Authorization: Bearer $TOKEN" \
              -H "User-Agent: LocalLLM-CI/1.0" \
              --output "$DEST/$MODEL.tmp" \
              --write-out "%{http_code}" \
              --retry 3 --retry-delay 10 \
              --max-time 1800 \
              --progress-bar \
              "https://huggingface.co/google/gemma-3-1b-it/resolve/main/gemma3-1b-it-int4.task")
            echo "google/gemma-3-1b-it: HTTP $HTTP_CODE"
          fi

          # Check file size — a real model is 600MB+, error pages are <100KB
          if [ "$HTTP_CODE" = "200" ]; then
            FILE_SIZE=$(stat -c%s "$DEST/$MODEL.tmp" 2>/dev/null || echo "0")
            echo "Downloaded: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -gt 104857600 ]; then
              mv "$DEST/$MODEL.tmp" "$DEST/$MODEL"
              SIZE=$(du -sh "$DEST/$MODEL" | cut -f1)
              echo "✅ Model bundled: $SIZE"
            else
              echo "⚠ File too small ($FILE_SIZE bytes) — likely an error page, not the model"
              rm -f "$DEST/$MODEL.tmp"
              echo "  Accept license at: huggingface.co/litert-community/Gemma3-1B-IT"
              echo "  AND at: huggingface.co/google/gemma-3-1b-it"
              echo "  Building without bundled model."
            fi
          else
            rm -f "$DEST/$MODEL.tmp"
            echo "⚠ HTTP $HTTP_CODE — building without bundled model"
            echo "  Accept license at: huggingface.co/litert-community/Gemma3-1B-IT"
          fi

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.version_code }}

      - name: Locate & rename APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/${{ steps.version.outputs.apk_name }}.apk"
          cp "$APK" "$DEST"
          echo "APK=$DEST" >> $GITHUB_ENV
          SIZE=$(du -sh "$DEST" | cut -f1)
          BYTES=$(stat -c%s "$DEST")
          echo "APK size: $SIZE ($BYTES bytes)"
          # Validate APK is a valid ZIP (APKs are ZIP files)
          if ! unzip -t "$DEST" > /dev/null 2>&1; then
            echo "❌ APK ZIP validation failed — corrupt APK"
            exit 1
          fi
          echo "✅ APK ZIP structure valid"
          # Check if model is bundled inside
          if unzip -l "$DEST" | grep -q "assets/models/gemma3"; then
            echo "✅ Gemma 3 1B model confirmed inside APK"
          else
            echo "⚠ Model not found inside APK — built without bundled model"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ env.APK }}
          retention-days: 30
          compression-level: 0

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: ./artifacts
      - name: Validate & prepare release APK
        run: |
          APK=$(find ./artifacts -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found in artifacts"
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "APK: $APK ($SIZE)"
          if ! unzip -t "$APK" > /dev/null 2>&1; then
            echo "❌ APK is corrupt — cannot release"
            exit 1
          fi
          echo "✅ APK valid — proceeding with release"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalLLM v${{ needs.build.outputs.version_name }}
          files: ./artifacts/*.apk
          generate_release_notes: true
          body: |
            ## 🤖 LocalLLM v${{ needs.build.outputs.version_name }}
            Local AI coding assistant — Gemma 3 1B built-in, fully offline.

            **This APK includes Gemma 3 1B (~700MB) — no downloads needed after install.**

            **Install:** Download APK → Settings → Unknown Sources → Install
            **First launch:** Shows a one-time setup screen (~30s) then ready to use.

            Features: Agent mode · Code editor · Terminal · HTML Preview · Local API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
