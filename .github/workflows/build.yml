name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name:     ${{ steps.version.outputs.apk_name }}
      is_release:   ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"; IS_RELEASE=true
          else
            VER="$(date +'%Y.%m.%d')-dev"; IS_RELEASE=false
          fi
          CODE=$(git rev-list --count HEAD)
          echo "version_name=$VER"         >> $GITHUB_OUTPUT
          echo "version_code=$CODE"        >> $GITHUB_OUTPUT
          echo "apk_name=LocalLLM-v$VER"  >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE"   >> $GITHUB_OUTPUT

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download bundled model (Gemma 3 1B)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DEST="app/src/main/assets/models"
          MODEL="gemma3-1b-q8.task"
          mkdir -p "$DEST"

          echo "Checking model-v1 release asset..."
          RELEASE_JSON=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/model-v1")

          echo "Release: $(echo $RELEASE_JSON | jq -r '.name // "not found"')"
          echo "Assets:  $(echo $RELEASE_JSON | jq -r '.assets | length')"
          echo $RELEASE_JSON | jq -r '.assets[] | "  \(.name) \(.size) bytes state=\(.state)"'

          ASSET_URL=$(echo $RELEASE_JSON | jq -r '.assets[] | select(.name == "gemma3-1b-q8.task") | .url')

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Asset not found — building without bundled model"
            exit 0
          fi

          echo "Downloading model..."
          HTTP_CODE=$(curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            --output "$DEST/$MODEL.tmp" \
            --write-out "%{http_code}" \
            --retry 3 --retry-delay 5 \
            --max-time 1800 \
            --progress-bar \
            "$ASSET_URL")

          echo "HTTP: $HTTP_CODE"
          FILE_SIZE=$(stat -c%s "$DEST/$MODEL.tmp" 2>/dev/null || echo "0")
          echo "Size: $FILE_SIZE bytes"

          if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 104857600 ]; then
            mv "$DEST/$MODEL.tmp" "$DEST/$MODEL"
            echo "Model bundled: $(du -sh $DEST/$MODEL | cut -f1)"
          else
            rm -f "$DEST/$MODEL.tmp"
            echo "Failed (HTTP $HTTP_CODE, $FILE_SIZE bytes) — building without model"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER:    ${{ steps.version.outputs.version_code }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER:    ${{ steps.version.outputs.version_code }}

      - name: Locate, rename and validate APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          DEST="app/build/outputs/apk/${{ steps.version.outputs.apk_name }}.apk"
          cp "$APK" "$DEST"
          echo "APK=$DEST" >> $GITHUB_ENV

          SIZE=$(du -sh "$DEST" | cut -f1)
          BYTES=$(stat -c%s "$DEST")
          echo "APK size: $SIZE ($BYTES bytes)"

          if ! unzip -t "$DEST" > /dev/null 2>&1; then
            echo "APK ZIP validation failed — corrupt APK"
            exit 1
          fi
          echo "APK structure valid"

          if unzip -l "$DEST" | grep -q "assets/models/gemma3"; then
            echo "Gemma 3 1B confirmed inside APK"
          else
            echo "Model not bundled — users will download on first launch"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ env.APK }}
          retention-days: 30
          compression-level: 0

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: ./artifacts

      - name: Validate APK
        run: |
          APK=$(find ./artifacts -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found in artifacts"
            exit 1
          fi
          if ! unzip -t "$APK" > /dev/null 2>&1; then
            echo "APK is corrupt — cannot release"
            exit 1
          fi
          echo "APK valid — $(du -sh $APK | cut -f1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalLLM v${{ needs.build.outputs.version_name }}
          files: ./artifacts/*.apk
          generate_release_notes: true
          body: |
            ## LocalLLM v${{ needs.build.outputs.version_name }}
            Local AI coding assistant — fully offline, no Play Store required.

            **Install:** Download APK → Settings → Unknown Sources → Install
            **First launch:** One-time setup screen (~30s) then ready to use.

            If bundled with Gemma 3 1B (~700MB), no extra downloads needed after install.

            Features: Agent mode · Code editor · Terminal · HTML Preview · Local API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
