name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 1: BUILD
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name:     ${{ steps.version.outputs.apk_name }}
      is_release:   ${{ steps.version.outputs.is_release }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for commit count

      # ── 2. JDK ───────────────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle setup (handles wrapper JAR automatically) ──────────────────
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: 📦 Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools"

      # ── 5. Version ───────────────────────────────────────────────────────────
      - name: 🏷️ Extract version info
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE="true"
          elif [[ "${{ github.event.inputs.build_type }}" == "release" ]]; then
            VERSION_NAME="$(date +'%Y.%m.%d')-manual"
            IS_RELEASE="true"
          else
            VERSION_NAME="$(date +'%Y.%m.%d')-dev"
            IS_RELEASE="false"
          fi

          VERSION_CODE=$(git rev-list --count HEAD)
          APK_NAME="LocalLLM-v${VERSION_NAME}"

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}"  >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}"          >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}"      >> $GITHUB_OUTPUT

          echo "──────────────────────────────"
          echo "Version:    ${VERSION_NAME}"
          echo "Code:       ${VERSION_CODE}"
          echo "Is Release: ${IS_RELEASE}"
          echo "──────────────────────────────"

      # ── 6. local.properties (required by AGP, no local file in repo) ─────────
      - name: ⚙️ Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ── 7. Inject secrets into build config ──────────────────────────────────
      - name: 🔐 Inject build config
        run: |
          # Write environment variables that build.gradle.kts reads
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"           >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${{ steps.version.outputs.version_name }}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ steps.version.outputs.version_code }}"    >> $GITHUB_ENV

      # ── 8. Keystore setup ────────────────────────────────────────────────────
      - name: 🔑 Setup release keystore
        if: steps.version.outputs.is_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "KEYSTORE_PATH=release.jks"                       >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                 >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"           >> $GITHUB_ENV
            echo "USE_DEBUG_KEYSTORE=false"                           >> $GITHUB_ENV
            echo "✅ Release keystore decoded"
          else
            echo "USE_DEBUG_KEYSTORE=true" >> $GITHUB_ENV
            echo "⚠️ No KEYSTORE_BASE64 secret — will use debug keystore"
          fi

      - name: 🔑 Generate debug keystore (fallback)
        if: steps.version.outputs.is_release != 'true'
        run: |
          keytool -genkey -v \
            -keystore app/debug.jks \
            -alias localllm-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -dname "CN=LocalLLM Debug, OU=Dev, O=LaiserDev, C=KE" \
            -storepass debugpass \
            -keypass debugpass
          echo "KEYSTORE_PATH=debug.jks"   >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=debugpass" >> $GITHUB_ENV
          echo "KEY_ALIAS=localllm-debug"   >> $GITHUB_ENV
          echo "KEY_PASSWORD=debugpass"     >> $GITHUB_ENV
          echo "✅ Debug keystore generated"

      # ── 9. Make gradlew executable ────────────────────────────────────────────
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      # ── 10. Lint (non-blocking) ───────────────────────────────────────────────
      - name: 🔍 Run lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: 📋 Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # ── 11. Build Debug APK ───────────────────────────────────────────────────
      - name: 🔨 Build Debug APK
        if: steps.version.outputs.is_release != 'true'
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }}

      # ── 12. Build Release APK ─────────────────────────────────────────────────
      - name: 🚀 Build Release APK
        if: steps.version.outputs.is_release == 'true'
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      # ── 13. Rename & verify APK ───────────────────────────────────────────────
      - name: 📦 Rename APK
        run: |
          # Find the built APK
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          DEST="app/build/outputs/apk/${{ steps.version.outputs.apk_name }}.apk"
          cp "$APK" "$DEST"

          echo "✅ APK ready: $DEST"
          echo "   Size: $(du -sh $DEST | cut -f1)"
          echo "apk_file=$DEST" >> $GITHUB_ENV

      # ── 14. APK info ──────────────────────────────────────────────────────────
      - name: 📊 APK info
        run: |
          APK="${{ env.apk_file }}"
          echo "──────────────────────────────────────"
          echo "APK: $(basename $APK)"
          echo "Size: $(du -sh $APK | cut -f1)"
          echo "SHA256: $(sha256sum $APK | cut -d' ' -f1)"
          echo "──────────────────────────────────────"
          # Print manifest info
          $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E "package|versionName|versionCode|uses-permission" || true

      # ── 15. Upload artifact ───────────────────────────────────────────────────
      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ env.apk_file }}
          retention-days: 90
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2: RELEASE (only on version tags)
  # ──────────────────────────────────────────────────────────────────────────────
  release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: ./release-artifacts

      - name: 🏷️ List artifacts
        run: ls -la ./release-artifacts/

      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges | head -20)
          else
            COMMITS=$(git log --oneline --no-merges | head -10)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LocalLLM v${{ needs.build.outputs.version_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version_name, '-') }}
          files: ./release-artifacts/*.apk
          generate_release_notes: false
          body: |
            # 🤖 LocalLLM v${{ needs.build.outputs.version_name }}

            Local AI coding assistant for Android — runs Gemma 4 fully on-device.

            ## 📱 Install
            1. Download **`LocalLLM-v${{ needs.build.outputs.version_name }}.apk`** below
            2. On your phone: **Settings → Security → Install Unknown Apps → Allow**
            3. Open the APK file → Install
            4. Open app → **Models** tab → Download a model
            5. Tap **Load** → start coding with local AI! 🚀

            ## ✨ Features
            - 🧠 Gemma 4 on-device inference (fully offline)
            - 💻 Code editor with file tree
            - 🔧 AI agent with 15 tools (read/write files, run commands, install packages)
            - ⚡ 12 built-in skills (generate project, fix bugs, write tests...)
            - 🖥️ Interactive terminal (npm/pip/apt support)
            - 🌐 Live HTML/CSS/JS preview
            - 🔌 Developer API on port 8080 with free API keys

            ## 📋 Requirements
            - Android 10+ (API 29+)
            - 4GB+ RAM (6GB+ recommended for 4B models)
            - 3GB+ free storage

            ## 🔑 Developer API
            Get a free API key at the dashboard to use LocalLLM in your own apps.

            ## 📝 Changes
            ```
            ${{ steps.changelog.outputs.commits }}
            ```

            ---
            **Build:** `${{ needs.build.outputs.version_code }}` • **By:** LaiserDev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3: NOTIFY (summary in Actions UI)
  # ──────────────────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Build Summary
    runs-on: ubuntu-latest
    needs: [ build ]
    if: always()

    steps:
      - name: 📊 Write job summary
        run: |
          echo "## 🤖 LocalLLM Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.build.outputs.version_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | \`${{ needs.build.outputs.version_code }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ needs.build.outputs.apk_name }}.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.build.outputs.is_release }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ APK available in **Actions → Artifacts → ${{ needs.build.outputs.apk_name }}**" >> $GITHUB_STEP_SUMMARY
          fi
